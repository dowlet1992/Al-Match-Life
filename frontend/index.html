<!doctype html>
<html lang="{{ ui.language_code|default('ru') }}" dir="{{ ui.text_direction|default('ltr') }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ ui.home_title }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/auth-entry.css">
    <script src="/static/auth-entry.js" defer></script>
</head>
<body>
<main class="auth-entry-card">
    <img class="auth-entry-logo" src="/static/app-logo.svg" alt="">
    <h1>NOVIX</h1>
    <p>{{ ui.home_tagline }}</p>

    <form method="post" action="/login">
        {{ csrf_token_input|safe }}
        <label class="visually-hidden" for="login-identifier">{{ ui.login_identifier }}</label>
        <input id="login-identifier" type="text" name="login" autocomplete="username" placeholder="{{ ui.login_identifier }}" required>

        <div class="password-wrap">
            <label class="visually-hidden" for="login-password">{{ ui.password }}</label>
            <input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="{{ ui.password }}" required>
            <button class="password-eye" type="button" data-password-toggle data-show-label="{{ ui.show_password }}" data-hide-label="{{ ui.hide_password }}" aria-label="{{ ui.show_password }}">👁</button>
        </div>

        <a class="forgot" href="/forgot_password">{{ ui.forgot_password }}</a>
        <button class="login-btn" type="submit">{{ ui.login }}</button>
    </form>

    <a class="register-btn" href="/register">{{ ui.create_account }}</a>
</main>
</body>
</html>
