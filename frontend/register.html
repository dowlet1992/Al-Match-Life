<!DOCTYPE html>
<html lang="{{ ui.language_code|default('ru') }}" dir="{{ ui.text_direction|default('ltr') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ ui.register_title }} — NOVIX</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/register.css">
<script src="/static/register.js" defer></script>
</head>
<body>
<div class="shell">
    <div class="brand">
        <img class="logo" src="/static/app-logo.svg" alt="" width="62" height="62">
        <div class="brand-name">NOVIX</div>
        <h1>{{ ui.register_title }}</h1>
        <p>{{ ui.register_subtitle }}</p>
    </div>

    <div class="card">
        <p class="section-title">{{ ui.basic_data }}</p>
        <p class="section-subtitle">{{ ui.basic_data_help }}</p>

        <form method="POST" action="/register" id="registerForm">
            {{ csrf_token_input|safe }}

            <input type="hidden" id="full_name" name="name">
            <input type="hidden" name="profession" value="">
            <input type="hidden" name="looking_for" value="">
            <input type="hidden" name="languages" value="">
            <input type="hidden" name="goals" value="">
            <input type="hidden" name="interests" value="">
            <input type="hidden" name="skills" value="">

            <div class="grid">
                <div class="field">
                    <label for="first_name">{{ ui.first_name }}</label>
                    <input id="first_name" type="text" autocomplete="given-name" placeholder="{{ ui.first_name }}" required>
                </div>
                <div class="field">
                    <label for="last_name">{{ ui.last_name }}</label>
                    <input id="last_name" type="text" autocomplete="family-name" placeholder="{{ ui.last_name }}" required>
                </div>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="age">{{ ui.age }}</label>
                    <input id="age" type="number" name="age" min="16" max="120" inputmode="numeric" placeholder="{{ ui.age_placeholder }}" required>
                </div>
                <div class="field">
                    <label for="country">{{ ui.country }}</label>
                    <input id="country" type="text" name="country" autocomplete="country-name" placeholder="{{ ui.country_placeholder }}" required>
                </div>
            </div>

            <div class="field">
                <label for="contact_type">{{ ui.verification_method }}</label>
                <select id="contact_type" name="contact_type" required>
                    <option value="email">{{ ui.verify_by_email }}</option>
                    <option value="phone">{{ ui.verify_by_phone }}</option>
                </select>
            </div>

            <div class="field" id="emailField">
                <label for="email">{{ ui.get('email_label', 'Email') }}</label>
                <input id="email" type="email" name="email" autocomplete="email" placeholder="name@example.com">
            </div>

            <div class="field" id="phoneField">
                <label for="phone_local">{{ ui.phone_number }}</label>
                <div class="phone-row">
                    <select id="country_code" aria-label="{{ ui.get('country_code', 'Country code') }}">
                        {% for country in phone_countries %}
                        <option value="{{ country.dial_code }}" data-region="{{ country.region }}">{{ country.region }} {{ country.dial_code }}</option>
                        {% endfor %}
                    </select>
                    <input id="phone_local" type="tel" autocomplete="tel" placeholder="170 1234567">
                </div>
                <input id="phone" type="hidden" name="phone">
            </div>

            <div class="grid">
                <div class="field">
                    <label for="password">{{ ui.password }}</label>
                    <div class="password-wrap">
                        <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" placeholder="{{ ui.password_minimum }}" required>
                        <button class="toggle-password" type="button" data-target="password" data-show-label="{{ ui.show_password }}" data-hide-label="{{ ui.hide_password }}" aria-pressed="false">{{ ui.show_password }}</button>
                    </div>
                </div>
                <div class="field">
                    <label for="password_confirm">{{ ui.repeat_password }}</label>
                    <div class="password-wrap">
                        <input id="password_confirm" type="password" autocomplete="new-password" minlength="8" placeholder="{{ ui.repeat_password_placeholder }}" required>
                        <button class="toggle-password" type="button" data-target="password_confirm" data-show-label="{{ ui.show_password }}" data-hide-label="{{ ui.hide_password }}" aria-pressed="false">{{ ui.show_password }}</button>
                    </div>
                </div>
            </div>
            <div id="passwordError" class="error">{{ ui.passwords_do_not_match }}</div>

            <div class="field bio-field">
                <label for="bio">{{ ui.about_short }} <span class="optional-label">({{ ui.short_label }})</span></label>
                <textarea id="bio" name="bio" maxlength="500" placeholder="{{ ui.bio_placeholder }}" required></textarea>
            </div>

            <button class="primary" type="submit">{{ ui.create_account }}</button>
            <p class="note">{{ ui.after_registration_note }}</p>
        </form>

        <div class="account-links">
            <a href="/">{{ ui.already_have_account }}</a>
        </div>
    </div>
</div>

</body>
</html>
